name: Build PC Facile ZIP Archive

on:
  release:
    types: [published]
  push:
    branches: [main]

concurrency:
  group: release-zip
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  attach-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Genera archivio ZIP con cartella "PC Facile"
        run: |
          git archive --format=zip --prefix="PC Facile/" -o "PC-Facile.zip" HEAD
      - name: Carica PC-Facile.zip sulla release corrente
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release view --json tagName -q .tagName || true)
          if [ -n "$TAG" ]; then
            gh release upload "$TAG" "PC-Facile.zip" --clobber
          fi
